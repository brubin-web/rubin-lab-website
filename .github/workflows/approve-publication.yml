name: Handle Publication Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# Deliberately no `concurrency` group here: GitHub keeps only one pending run
# per group and cancels the older one, so approving several issues in a row
# would silently drop the middle one. The push below retries instead.

jobs:
  handle-approval:
    # Only run on issues with the 'publication' label, and only for commands
    # from the repo owner. Without an author check, any GitHub user could
    # comment "/approve" on a public issue and get arbitrary content committed
    # to the live site.
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'publication') &&
      github.event.comment.user.login == github.repository_owner &&
      (contains(github.event.comment.body, '/approve') || contains(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Process approval command
        id: process
        working-directory: scripts
        env:
          ISSUE_COMMENT: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node approve-publication.js

      - name: Commit changes
        env:
          PUB_ACTION: ${{ steps.process.outputs.action }}
          PUB_TITLE: ${{ steps.process.outputs.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/publications.json publications.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit \
            -m "Update publications: $PUB_ACTION publication" \
            -m "Issue: #$ISSUE_NUMBER" \
            -m "Title: $PUB_TITLE"

          # Another approval may have landed while this one was running.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "Could not push after 3 attempts."
          exit 1

      # These gate on what the script actually did, not on the comment text: a
      # bare "/approve" with no doi:/pmid: is a no-op, and closing the issue
      # with a success message would lose the publication from the queue.
      - name: Close issue on approval
        if: steps.process.outputs.action == 'approve'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['publication', 'approved']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Publication approved and added to the website. The changes will be visible shortly.'
            });

      - name: Close issue on rejection
        if: steps.process.outputs.action == 'reject'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['publication', 'rejected']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ Publication rejected. It will not appear on the website and won\'t be suggested again.'
            });

      # always(), so this still reports back when an earlier step failed —
      # a silent red badge on the run is exactly what a mistyped command
      # must not produce.
      - name: Explain why nothing was changed
        if: always() && steps.process.outputs.action == ''
        uses: actions/github-script@v8
        env:
          PROBLEM: ${{ steps.process.outputs.problem }}
        with:
          script: |
            const problem = process.env.PROBLEM
              || 'Something went wrong handling that command and nothing was changed — see the workflow run for details.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ ${problem}`
            });
