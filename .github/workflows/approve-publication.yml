name: Handle Publication Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# Two /approve comments in quick succession would otherwise race each other to
# push to main, and the loser fails on a non-fast-forward.
concurrency:
  group: publications-update
  cancel-in-progress: false

jobs:
  handle-approval:
    # Only run on issues with the 'publication' label, and only for commands
    # from the repo owner. Without an author check, any GitHub user could
    # comment "/approve" on a public issue and get arbitrary content committed
    # to the live site.
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'publication') &&
      github.event.comment.user.login == github.repository_owner &&
      (contains(github.event.comment.body, '/approve') || contains(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Process approval command
        id: process
        working-directory: scripts
        env:
          ISSUE_COMMENT: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node approve-publication.js

      - name: Commit changes
        env:
          PUB_ACTION: ${{ steps.process.outputs.action }}
          PUB_TITLE: ${{ steps.process.outputs.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/publications.json publications.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit \
            -m "Update publications: $PUB_ACTION publication" \
            -m "Issue: #$ISSUE_NUMBER" \
            -m "Title: $PUB_TITLE"
          git pull --rebase --autostash origin main
          git push

      # These gate on what the script actually did, not on the comment text: a
      # bare "/approve" with no doi:/pmid: is a no-op, and closing the issue
      # with a success message would lose the publication from the queue.
      - name: Close issue on approval
        if: steps.process.outputs.action == 'approve'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['publication', 'approved']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Publication approved and added to the website. The changes will be visible shortly.'
            });

      - name: Close issue on rejection
        if: steps.process.outputs.action == 'reject'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['publication', 'rejected']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ Publication rejected. It will not appear on the website and won\'t be suggested again.'
            });

      - name: Explain an unrecognised command
        if: steps.process.outputs.action == ''
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'I could not read that command, so nothing was changed. Use `/approve doi:<DOI>` or `/reject doi:<DOI>` exactly as written in the issue above.'
            });
