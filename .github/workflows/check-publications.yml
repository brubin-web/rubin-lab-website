name: Check for New Publications

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check for new publications
        id: check
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: node fetch-publications.js

      # When a new publication is found, this workflow opens a GitHub issue
      # (labeled "publication") assigned to the repo owner and @-mentioning
      # them, which is what generates the review email. Merely opening an issue
      # notifies only people watching the repo with "All Activity", so the
      # assignment and mention are what make the email reliable.
